name: AI PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m ai_pr_review_agent genesis check
      - run: python -m ai_pr_review_agent ingest --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - run: python -m ai_pr_review_agent review --pr "$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - run: python -m ai_pr_review_agent route --pr "$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - run: python -m ai_pr_review_agent publish --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
