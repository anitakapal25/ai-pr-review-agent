[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pr-review-agent"
version = "0.2.0"
description = "Evidence-grounded, GitHub-native pull request reviewer"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
pr-review = "ai_pr_review_agent.cli:main"
genesis = "ai_pr_review_agent.genesis:main"

[tool.setuptools.packages.find]
include = ["ai_pr_review_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

